[project]
name = "boothpulse"
version = "0.1.0"
description = "BoothPulse booth agent and dashboard app (Android and iOS)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet>=1.1.3",
    "certifi",
]

[dependency-groups]
dev = [
    "flet-cli>=1.1.3",
    "flet-desktop>=1.1.3",
    "flet-web>=1.1.3",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.flet]
org = "com.prarahul"
bundle_id = "com.prarahul.boothpulse"
product = "BoothPulse"
company = "BoothPulse"
copyright = "Copyright (C) 2026 BoothPulse"
desktop_flavor = "light"
icon_background = "#0B1F3A"

[tool.flet.app]
path = "src"

[tool.flet.android.permission]
"android.permission.INTERNET" = true
