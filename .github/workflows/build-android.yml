name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/build-android.yml"]
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: cd backend && python manage.py test

  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Flet CLI
        run: pip install "flet[all]>=1.1.3"
      - name: Build APK
        working-directory: mobile
        env:
          PYTHONIOENCODING: utf-8
        run: flet build apk --yes --verbose --build-number ${{ github.run_number }}
      - name: Rename APK
        run: cp mobile/build/apk/*.apk BoothPulse-demo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: boothpulse-android-apk
          path: BoothPulse-demo.apk
          retention-days: 14
      # Direct .apk download on the repo's Releases page (no zip).
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BoothPulse demo build ${{ github.run_number }}
          body: |
            Android APK. Install it, then tap "Try the demo" on the login screen (no server needed).
            For the live version, enter the backend's HTTPS address under Server settings.
          files: BoothPulse-demo.apk
          make_latest: true
